name: Publier le configurateur

# Chaque envoi sur main republie le site.
# La commande Rhino « PublierBibliotheque » ecrit data/library.json
# via l'API GitHub : ce workflow se declenche donc tout seul.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Controler la bibliotheque
        run: python3 tools/check_library.py data/library.json

      - name: Preparer le site
        # seuls les fichiers utiles au navigateur sont publies :
        # les scripts Rhino et les outils restent dans le depot.
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'rhino' \
            --exclude 'tools' \
            ./ _site/
          echo "Fichiers publies :"
          find _site -type f | sed 's|^_site/||' | sort

      # Prealable, a faire UNE FOIS dans le depot :
      #   Settings -> Pages -> Build and deployment -> Source : GitHub Actions
      # (le jeton automatique d'Actions n'a pas le droit de creer le site
      #  lui-meme : l'option « enablement » echoue en « Resource not
      #  accessible by integration ».)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4

      - name: Adresse publiee
        run: |
          echo "Configurateur en ligne : ${{ steps.deploiement.outputs.page_url }}"
