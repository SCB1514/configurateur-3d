name: Publier le configurateur

# Chaque envoi sur main republie le site.
# La commande Rhino « PublierBibliotheque » ecrit data/library.json
# via l'API GitHub : ce workflow se declenche donc tout seul.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Controler la bibliotheque
        run: python3 tools/check_library.py data/library.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploiement
        uses: actions/deploy-pages@v4

      - name: Adresse publiee
        run: echo "Configurateur en ligne : ${{ steps.deploiement.outputs.page_url }}"
